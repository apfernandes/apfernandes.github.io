<!DOCTYPE html>

<meta charset="UTF-8">

<title>GPS Globe — World Capitals</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#010108; }
  canvas { display:block; cursor:grab; position:fixed; top:0; left:0; }
  canvas:active { cursor:grabbing; }

  #info {
    position:fixed; bottom:0; left:0; right:0;
    background:rgba(4,6,18,.9); border-top:1px solid #141e40;
    padding:10px 16px 12px;
    font-family:'Share Tech Mono',monospace; font-size:11px;
    backdrop-filter:blur(6px);
    pointer-events:none;
  }
  #city-name { font-family:'Orbitron',sans-serif; font-size:12px; color:#fff; letter-spacing:.5px; }
  #city-coords { font-size:10px; color:#5aa0ff; margin-top:3px; }
  #controls-hint { font-size:10px; color:#1e2840; margin-top:5px; }

  #btns {
    position:fixed; top:12px; right:14px;
    display:flex; gap:8px;
  }
  button {
    background:rgba(10,20,50,.8); border:1px solid #1e3570;
    color:#4a7acc; font-family:'Share Tech Mono',monospace;
    font-size:10px; letter-spacing:1px; padding:5px 13px;
    cursor:pointer; text-transform:uppercase; transition:.15s;
    backdrop-filter:blur(4px);
  }
  button:hover { background:rgba(20,40,90,.9); color:#8ab4ff; border-color:#2e55a0; }

  #title {
    position:fixed; top:15px; left:16px;
    font-family:'Orbitron',sans-serif; font-size:11px;
    color:#253060; letter-spacing:5px; text-transform:uppercase;
    pointer-events:none;
  }
</style>
</head>
<body>

<div id="title">World Capitals</div>
<div id="btns">

</div>

  <div id="city-name">Click a capital to see great-circle routes to its 5 nearest neighbours</div>
  <div id="city-coords"></div>
  <div id="controls-hint">Drag to rotate &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Click capital to select</div>

// ── Canvas & resize ───────────────────────────────────────────────────────────
const canvas = document.getElementById('globe');
const ctx = canvas.getContext('2d');
const INFO_H = 62;
let W, H, CX, CY, radius, stars = [];

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W; canvas.height = H;
  CX = W/2; CY = (H - INFO_H)/2;
  radius = Math.min(W, H - INFO_H) * 0.42;
  function rng32(s){ return()=>{ s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  const rnd = rng32(12345);
  const count = Math.min(600, Math.floor(W*H/2500));
  stars = Array.from({length:count}, ()=>({x:Math.floor(rnd()*W), y:Math.floor(rnd()*(H-INFO_H)), b:Math.floor(50+rnd()*185)}));
}
window.addEventListener('resize', resize);
resize();

// ── State ─────────────────────────────────────────────────────────────────────
let sl=0, sll=0, selectedCity=-1, spinning=true;

// ── Projection ────────────────────────────────────────────────────────────────
function project(lat, lon) {
  const lr=-lat*PI/180, nr=lon*PI/180;
  const p1=Math.cos(lr+sll);
  const adj=p1<0?PI:0, p1a=Math.abs(p1);
  if(Math.sin(nr+sl+PI/2+adj)*p1a<=0) return null;
  return {x: CX+radius*Math.sin(nr+sl+adj)*p1a, y: CY+radius*Math.sin(lr+sll)};
}

// ── Great-circle distance ─────────────────────────────────────────────────────
function gcKm(a, b) {
  const la=cities[a].lat*PI/180, lb=cities[b].lat*PI/180;
  const lo=cities[a].lon*PI/180, lp=cities[b].lon*PI/180;
  const dl=lb-la, dn=lp-lo;
  const h=Math.sin(dl/2)**2+Math.cos(la)*Math.cos(lb)*Math.sin(dn/2)**2;
  return 6371*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}

// ── Arc ───────────────────────────────────────────────────────────────────────
function drawArc(a, b) {
  const la=-cities[a].lat*PI/180, lo=cities[a].lon*PI/180;
  const lb=-cities[b].lat*PI/180, lp=cities[b].lon*PI/180;
  const ax=Math.cos(la)*Math.cos(lo),ay=Math.cos(la)*Math.sin(lo),az=Math.sin(la);
  const bx=Math.cos(lb)*Math.cos(lp),by=Math.cos(lb)*Math.sin(lp),bz=Math.sin(lb);
  const dot=Math.min(1,Math.max(-1,ax*bx+ay*by+az*bz));
  if(dot>0.9999) return;
  const d=Math.acos(dot), sinD=Math.sin(d);
  let prev=null;
  for(let i=0;i<=80;i++){
    const t=i/80,A=Math.sin((1-t)*d)/sinD,B=Math.sin(t*d)/sinD;
    const xi=A*ax+B*bx,yi=A*ay+B*by,zi=A*az+B*bz;
    const latI=Math.atan2(zi,Math.sqrt(xi*xi+yi*yi))*180/PI;
    const lonI=Math.atan2(yi,xi)*180/PI;
    const pt=project(-latI,lonI);
    if(pt&&prev){const dx=pt.x-prev.x,dy=pt.y-prev.y;if(dx*dx+dy*dy<40000){ctx.moveTo(prev.x,prev.y);ctx.lineTo(pt.x,pt.y);}}
    prev=pt;
  }
}

// ── Grid ──────────────────────────────────────────────────────────────────────
function drawGrid() {
  ctx.lineWidth=.6; ctx.strokeStyle='rgba(35,80,160,.7)';
  for(const lat of [-60,-30,30,60]){
    ctx.beginPath(); let prev=null;
    for(let lon=-180;lon<=180;lon+=4){const pt=project(lat,lon);if(pt&&prev){const dx=pt.x-prev.x,dy=pt.y-prev.y;if(dx*dx+dy*dy<40000){ctx.moveTo(prev.x,prev.y);ctx.lineTo(pt.x,pt.y);}}prev=pt;}
    ctx.stroke();
  }
  ctx.beginPath();
  for(let lon=-180;lon<180;lon+=30){let prev=null;for(let lat=-90;lat<=90;lat+=4){const pt=project(lat,lon);if(pt&&prev){const dx=pt.x-prev.x,dy=pt.y-prev.y;if(dx*dx+dy*dy<40000){ctx.moveTo(prev.x,prev.y);ctx.lineTo(pt.x,pt.y);}}prev=pt;}}
  ctx.stroke();
  ctx.strokeStyle='rgba(55,110,210,.9)'; ctx.lineWidth=.9;
  ctx.beginPath(); let prev=null;
  for(let lon=-180;lon<=180;lon+=4){const pt=project(0,lon);if(pt&&prev){const dx=pt.x-prev.x,dy=pt.y-prev.y;if(dx*dx+dy*dy<40000){ctx.moveTo(prev.x,prev.y);ctx.lineTo(pt.x,pt.y);}}prev=pt;}
  ctx.stroke();
}

// ── Draw ──────────────────────────────────────────────────────────────────────
function draw() {
  ctx.fillStyle='#010108'; ctx.fillRect(0,0,W,H);
  for(const s of stars){ctx.fillStyle=`rgb(${s.b},${s.b},${s.b})`;ctx.fillRect(s.x,s.y,1,1);}

  ctx.beginPath(); ctx.arc(CX,CY,radius,0,2*PI);
  const grd=ctx.createRadialGradient(CX-radius*.28,CY-radius*.28,0,CX,CY,radius);
  grd.addColorStop(0,'#1d4fbd'); grd.addColorStop(1,'#0c2a70');
  ctx.fillStyle=grd; ctx.fill();

  drawGrid();

  // Atmosphere
  const atmo=ctx.createRadialGradient(CX,CY,radius*.88,CX,CY,radius*1.12);
  atmo.addColorStop(0,'rgba(60,110,255,.1)'); atmo.addColorStop(1,'transparent');
  ctx.beginPath(); ctx.arc(CX,CY,radius*1.12,0,2*PI); ctx.fillStyle=atmo; ctx.fill();
  ctx.beginPath(); ctx.arc(CX,CY,radius+2,0,2*PI);
  ctx.strokeStyle='rgba(80,130,255,.4)'; ctx.lineWidth=3; ctx.stroke();

  // Arcs
  if(selectedCity>=0){
    const dists=cities.map((_,i)=>i===selectedCity?Infinity:gcKm(selectedCity,i));
    for(let k=0;k<5;k++){
      let near=-1,minD=Infinity;
      for(let i=0;i<cities.length;i++) if(dists[i]<minD){minD=dists[i];near=i;}
      if(near<0) break;
      ctx.strokeStyle=`rgba(255,210,50,${1-k*0.15})`; ctx.lineWidth=1.5;
      ctx.beginPath(); drawArc(selectedCity,near); ctx.stroke();
      dists[near]=Infinity;
    }
  }

  // City dots & labels — scale label size with zoom
  const ls=Math.max(0.7,Math.min(1.4,radius/180));
  const dotR = Math.max(1.5, radius/120);
  for(let i=0;i<cities.length;i++){
    const pt=project(cities[i].lat,cities[i].lon);
    if(!pt) continue;
    if(i===selectedCity){
      ctx.beginPath(); ctx.arc(pt.x,pt.y,6,0,2*PI); ctx.fillStyle='#ff3c3c'; ctx.fill();
      ctx.beginPath(); ctx.arc(pt.x,pt.y,8.5,0,2*PI); ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.font=`bold ${Math.round(10*ls)}px Orbitron,monospace`; ctx.fillStyle='#ffe84a';
      ctx.fillText(cities[i].name, pt.x+11, pt.y+4);
    } else {
      ctx.beginPath(); ctx.arc(pt.x,pt.y,dotR,0,2*PI); ctx.fillStyle='#ffd73c'; ctx.fill();
      // Only show labels if zoomed in enough to avoid clutter
      if(radius > 140){
        ctx.font=`${Math.round(8*ls)}px Share Tech Mono,monospace`; ctx.fillStyle='rgba(190,205,235,.7)';
        ctx.fillText(cities[i].name, pt.x+dotR+2, pt.y+3);
      }
    }
  }
}

// ── Info panel ────────────────────────────────────────────────────────────────
function updateInfo(){
  const ne=document.getElementById('city-name'), co=document.getElementById('city-coords');
  if(selectedCity<0){
    ne.textContent='Click a capital to see great-circle routes to its 5 nearest neighbours';
    co.textContent=''; return;
  }
  const c=cities[selectedCity];
  const latS=`${Math.abs(c.lat).toFixed(2)}°${c.lat>=0?'N':'S'}`;
  const lonS=`${Math.abs(c.lon).toFixed(2)}°${c.lon>=0?'E':'W'}`;
  let minD=Infinity,nearN='';
  for(let i=0;i<cities.length;i++){if(i===selectedCity)continue;const d=gcKm(selectedCity,i);if(d<minD){minD=d;nearN=cities[i].name;}}
  ne.textContent=`${c.name}   ${latS}  ${lonS}`;
  co.textContent=`Nearest capital: ${Math.round(minD).toLocaleString()} km (${nearN})  ·  Showing great-circle arcs to 5 closest capitals`;
}

// ── Loop ──────────────────────────────────────────────────────────────────────
function loop(){ if(spinning) sl+=PI/500; draw(); requestAnimationFrame(loop); }

// ── Controls ──────────────────────────────────────────────────────────────────
document.getElementById('reset-btn').addEventListener('click',()=>{
  sl=0;sll=0;radius=Math.min(W,H-INFO_H)*.42;selectedCity=-1;spinning=true;
  document.getElementById('spin-btn').textContent='Pause'; updateInfo();
});
document.getElementById('spin-btn').addEventListener('click',()=>{
  spinning=!spinning;
  document.getElementById('spin-btn').textContent=spinning?'Pause':'Resume';
});

// ── Mouse ─────────────────────────────────────────────────────────────────────
let dragging=false,lx=0,ly=0,px=0,py=0;
canvas.addEventListener('mousedown',e=>{dragging=true;lx=px=e.clientX;ly=py=e.clientY;});
canvas.addEventListener('mousemove',e=>{if(!dragging)return;sl+=(e.clientX-lx)*PI/200;sll+=(e.clientY-ly)*PI/200;lx=e.clientX;ly=e.clientY;});
canvas.addEventListener('mouseup',e=>{
  const dx=e.clientX-px,dy=e.clientY-py;
  if(dx*dx+dy*dy<=25){
    let best=-1,bestD=20*20;
    for(let i=0;i<cities.length;i++){const pt=project(cities[i].lat,cities[i].lon);if(!pt)continue;const d=(pt.x-e.clientX)**2+(pt.y-e.clientY)**2;if(d<bestD){bestD=d;best=i;}}
    selectedCity=best; updateInfo();
  }
  dragging=false;
});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  radius-=e.deltaY*.3;
  radius=Math.max(60,Math.min(Math.min(W,H-INFO_H)*.48,radius));
},{passive:false});

// ── Touch ─────────────────────────────────────────────────────────────────────
let tl=null;
canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];tl={x:t.clientX,y:t.clientY,px:t.clientX,py:t.clientY};},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!tl)return;const t=e.touches[0];sl+=(t.clientX-tl.x)*PI/200;sll+=(t.clientY-tl.y)*PI/200;tl.x=t.clientX;tl.y=t.clientY;},{passive:false});
canvas.addEventListener('touchend',e=>{
  if(tl){const dx=tl.x-tl.px,dy=tl.y-tl.py;if(dx*dx+dy*dy<=25){let best=-1,bestD=24*24;for(let i=0;i<cities.length;i++){const pt=project(cities[i].lat,cities[i].lon);if(!pt)continue;const d=(pt.x-tl.px)**2+(pt.y-tl.py)**2;if(d<bestD){bestD=d;best=i;}}selectedCity=best;updateInfo();}}tl=null;
});

loop();
</script>
</body>
</html>
