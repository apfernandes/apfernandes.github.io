// ── Projection / pan / zoom state ────────────────────────────────
let W, H;
// viewScale: pixels per degree of LATITUDE; viewCX/CY: lon/lat at screen centre
let viewScale, viewCX, viewCY;
const BASE_LON_MIN = -9.8, BASE_LON_MAX = -6.0;
const BASE_LAT_MIN = 35.8, BASE_LAT_MAX = 44.2;
const BASE_LAT_COS = Math.cos(((BASE_LAT_MIN + BASE_LAT_MAX) / 2) * Math.PI / 180); // ≈ cos(40°)

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  if (!viewScale) resetView();
}

function resetView() {
  const pad = 60;
  // Degrees of lon/lat in the bounding box
  const dLon = BASE_LON_MAX - BASE_LON_MIN;
  const dLat = BASE_LAT_MAX - BASE_LAT_MIN;
  // Scale in px/degree-lat, accounting for lon compression at this latitude
  const sx = (W - pad*2) / (dLon * BASE_LAT_COS); // px per deg-lat, from lon span
  const sy = (H - pad*2) / dLat;                   // px per deg-lat, from lat span
  viewScale = Math.min(sx, sy);
  viewCX = (BASE_LON_MIN + BASE_LON_MAX) / 2;
  viewCY = (BASE_LAT_MIN + BASE_LAT_MAX) / 2;
}

// Convert lon/lat → screen px  (equirectangular with cosine correction)
function project(lon, lat) {
  return [
    W/2 + (lon - viewCX) * viewScale * BASE_LAT_COS,
    H/2 - (lat - viewCY) * viewScale
  ];
}

// Convert screen px → lon/lat
function unproject(px, py) {
  return [
    viewCX + (px - W/2) / (viewScale * BASE_LAT_COS),
    viewCY - (py - H/2) / viewScale
  ];
}

// ── Mouse: pan (single button) & wheel zoom ───────────────────────
let isDragging = false, dragStartX, dragStartY, dragCX0, dragCY0;

canvas.addEventListener('mousedown', e => {
  isDragging = true;
  dragStartX = e.clientX; dragStartY = e.clientY;
  dragCX0 = viewCX; dragCY0 = viewCY;
  canvas.style.cursor = 'grabbing';
});
window.addEventListener('mouseup', () => { isDragging = false; canvas.style.cursor = 'crosshair'; });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const [lonPivot, latPivot] = unproject(mx, my);
  const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
  viewScale = Math.max(40, Math.min(viewScale * factor, 12000));
  viewCX = lonPivot - (mx - W/2) / (viewScale * BASE_LAT_COS);
  viewCY = latPivot + (my - H/2) / viewScale;
}, { passive: false });

// ── Touch: two-finger pan, pinch zoom, tap for info ───────────────
let touches = {};           // active touches keyed by identifier
let pinchDist0 = null;      // initial pinch distance
let pinchScale0 = null;     // viewScale at pinch start
let pinchCX0 = null;        // viewCX at pinch start
let pinchCY0 = null;        // viewCY at pinch start
let pinchMidLon0 = null;    // lon/lat of pinch midpoint at start
let pinchMidLat0 = null;
let tapStartTime = 0;
let tapStartX = 0, tapStartY = 0;
let tapMoved = false;
const TAP_MAX_MS = 300, TAP_MAX_MOVE = 10;

function getTouchDist(a, b) {
  return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
}
function getTouchMid(a, b) {
  return { x: (a.clientX + b.clientX)/2, y: (a.clientY + b.clientY)/2 };
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) touches[t.identifier] = t;

  const ids = Object.keys(touches);

  if (ids.length === 1) {
    // Possible tap
    tapStartTime = Date.now();
    tapStartX = touches[ids[0]].clientX;
    tapStartY = touches[ids[0]].clientY;
    tapMoved = false;
  }

  if (ids.length === 2) {
    const [ta, tb] = ids.map(id => touches[id]);
    pinchDist0  = getTouchDist(ta, tb);
    pinchScale0 = viewScale;
    pinchCX0    = viewCX;
    pinchCY0    = viewCY;
    const mid = getTouchMid(ta, tb);
    const rect = canvas.getBoundingClientRect();
    [pinchMidLon0, pinchMidLat0] = unproject(mid.x - rect.left, mid.y - rect.top);
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) touches[t.identifier] = t;
  const ids = Object.keys(touches);

  if (ids.length === 2) {
    const [ta, tb] = ids.map(id => touches[id]);
    const mid = getTouchMid(ta, tb);
    const rect = canvas.getBoundingClientRect();
    const midX = mid.x - rect.left, midY = mid.y - rect.top;

    // Pinch zoom
    const dist = getTouchDist(ta, tb);
    if (pinchDist0 && dist > 0) {
      const factor = dist / pinchDist0;
      viewScale = Math.max(40, Math.min(pinchScale0 * factor, 12000));
    }

    // Two-finger pan: keep the initial midpoint lon/lat under current midpoint
    viewCX = pinchMidLon0 - (midX - W/2) / (viewScale * BASE_LAT_COS);
    viewCY = pinchMidLat0 + (midY - H/2) / viewScale;

    tapMoved = true;
    tooltip.style.display = 'none';
    hoveredIndex = -1;
  } else if (ids.length === 1) {
    const dx = Math.abs(touches[ids[0]].clientX - tapStartX);
    const dy = Math.abs(touches[ids[0]].clientY - tapStartY);
    if (dx > TAP_MAX_MOVE || dy > TAP_MAX_MOVE) tapMoved = true;
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) delete touches[t.identifier];

  const remaining = Object.keys(touches).length;

  if (remaining === 0) {
    pinchDist0 = null;

    // Detect tap
    if (!tapMoved && Date.now() - tapStartTime < TAP_MAX_MS) {
      const rect = canvas.getBoundingClientRect();
      const tx = tapStartX - rect.left, ty = tapStartY - rect.top;
      let found = -1, minD = 30;
      lighthouses.forEach((lh, i) => {
        const [x, y] = project(lh.lon, lh.lat);
        const d = Math.hypot(tx - x, ty - y);
        if (d < minD) { minD = d; found = i; }
      });
      if (found >= 0) {
        const lh = lighthouses[found];
        hoveredIndex = found;
        tooltip.style.display = 'block';
        // Position tooltip above the tap point, keep on screen
        tooltip.style.left = Math.min(tapStartX + 10, window.innerWidth  - 270) + 'px';
        tooltip.style.top  = Math.max(tapStartY - 120, 10) + 'px';
        tooltip.innerHTML = `
          <div class="lh-name">${lh.name}</div>
          <div class="lh-meta">${lh.desc}</div>
          <div class="lh-meta">Est. ${lh.year} &nbsp;·&nbsp; ${lh.lat.toFixed(3)}°N ${Math.abs(lh.lon).toFixed(3)}°W</div>
          <div class="lh-flash">⚡ ${lh.flash} &nbsp;·&nbsp; T = ${lh.period > 0 ? lh.period + 's' : 'inativo'}</div>`;
      } else {
        hoveredIndex = -1;
        tooltip.style.display = 'none';
      }
    }
  }

  if (remaining < 2) {
    pinchDist0 = null;
    // Re-anchor pan if one finger lifts during two-finger gesture
    if (remaining === 1) {
      const id = Object.keys(touches)[0];
      const t = touches[id];
      dragStartX = t.clientX; dragStartY = t.clientY;
      dragCX0 = viewCX; dragCY0 = viewCY;
    }
  }
}, { passive: false });

// ── Draw GeoJSON polygons ─────────────────────────────────────────
function drawGeoJSON() {
  IBERIA_GEOJSON.features.forEach(feature => {
    const isPortugal = feature.properties.name === 'Portugal';
    const geom = feature.geometry;
    const polys = geom.type === 'Polygon' ? [geom.coordinates] : geom.coordinates;

    polys.forEach(poly => {
      const ring = poly[0];
      if (ring.length < 20) return;

      ctx.beginPath();
      ring.forEach(([lon, lat], i) => {
        const [x, y] = project(lon, lat);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      });
      ctx.closePath();

      // Subtle fill
      ctx.fillStyle = isPortugal ? 'rgba(0,60,20,0.12)' : 'rgba(0,30,10,0.07)';
      ctx.fill();

      // Neon green border — brighter for Portugal
      ctx.shadowColor = isPortugal ? '#00ff66' : '#00cc44';
      ctx.shadowBlur  = isPortugal ? 16 : 8;
      ctx.strokeStyle = isPortugal ? '#00ff66' : '#007733';
      ctx.lineWidth   = isPortugal ? 1.4 : 0.8;
      ctx.stroke();
      ctx.shadowBlur  = 0;
    });
  });
}

// ── Label placement — anti-overlap ───────────────────────────────
// Pre-compute short names
const SHORT_NAMES = lighthouses.map(lh =>
  lh.name
    .replace(/^Farol (do |da |de |d'|)/, '')
);

// Candidate offsets (dx, dy from dot centre) tried in priority order
const LABEL_CANDIDATES = [
  [8, -8],   // right-up  (default)
  [8,  12],  // right-down
  [-8, -8],  // left-up
  [-8,  12], // left-down
  [8,  -20], // right-up-far
  [-8, -20], // left-up-far
  [0,  -18], // straight up
  [0,   18], // straight down
];

// Returns {x, y, align} for label i, avoiding already-placed rects
function pickLabelPos(idx, dotX, dotY, placed) {
  const FONT_SIZE = 10;
  ctx.font = `${FONT_SIZE}px 'Share Tech Mono', monospace`;
  const tw = ctx.measureText(SHORT_NAMES[idx]).width;
  const th = FONT_SIZE;
  const PAD = 2;

  for (const [dx, dy] of LABEL_CANDIDATES) {
    const align = dx < 0 ? 'right' : 'left';
    const lx = dx < 0 ? dotX + dx - tw : dotX + dx;
    const ly = dotY + dy - th;
    const rect = { x: lx - PAD, y: ly - PAD, w: tw + PAD*2, h: th + PAD*2 };

    // Check overlap with already-placed labels
    const overlaps = placed.some(r =>
      rect.x < r.x + r.w && rect.x + rect.w > r.x &&
      rect.y < r.y + r.h && rect.y + rect.h > r.y
    );
    if (!overlaps) {
      placed.push(rect);
      return { lx: dotX + dx, ly: dotY + dy, align };
    }
  }
  // Fallback: use first candidate even if overlapping
  const [dx, dy] = LABEL_CANDIDATES[0];
  return { lx: dotX + dx, ly: dotY + dy, align: 'left' };
}

// ── Hover state ───────────────────────────────────────────────────
let hoveredIndex = -1;

function hexAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function getBeamColor(flash) {
  if (flash.includes('R')) return { beam: '#ff3300', core: '#ff6644' };
  if (flash.includes('G')) return { beam: '#00ff88', core: '#44ffaa' };
  return { beam: '#ffffaa', core: '#ffffff' };
}

function drawBeam(x, y, lh, timestamp) {
  const rangePixels = (30 / 111.0) * viewScale;
  const beamHalfRad = (15 * Math.PI) / 180 / 2;
  const c = getBeamColor(lh.flash);
  const angle = (timestamp * (2 * Math.PI) / (lh.period * 1000)) % (2 * Math.PI);

  const layers = [
    { spread: 0.002, alphaCenter: 0.55, radiusMult: 1.00 },
    { spread: 0.05,  alphaCenter: 0.28, radiusMult: 1.06 },
    { spread: 0.12,  alphaCenter: 0.13, radiusMult: 1.14 },
    { spread: 0.22,  alphaCenter: 0.05, radiusMult: 1.24 },
  ];
  layers.forEach(({ spread, alphaCenter, radiusMult }) => {
    const r = rangePixels * radiusMult;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.arc(x, y, r, angle - beamHalfRad - spread, angle + beamHalfRad + spread);
    ctx.closePath();
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0,   hexAlpha(c.beam, alphaCenter + 0.15));
    grad.addColorStop(0.4, hexAlpha(c.beam, alphaCenter));
    grad.addColorStop(1,   hexAlpha(c.beam, 0));
    ctx.fillStyle = grad;
    ctx.fill();
  });

  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + Math.cos(angle) * rangePixels, y + Math.sin(angle) * rangePixels);
  ctx.strokeStyle = hexAlpha(c.core, 0.85);
  ctx.lineWidth = 1.5;
  ctx.shadowColor = c.beam;
  ctx.shadowBlur = 12;
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.beginPath();
  ctx.arc(x, y, rangePixels, 0, Math.PI * 2);
  ctx.strokeStyle = hexAlpha(c.beam, 0.07);
  ctx.lineWidth = 0.5;
  ctx.stroke();

  ctx.font = "8px 'Share Tech Mono', monospace";
  ctx.fillStyle = hexAlpha(c.beam, 0.35);
  ctx.textAlign = 'center';
  ctx.fillText('30 km', x + rangePixels * 0.72 * Math.cos(angle - 0.35),
                         y + rangePixels * 0.72 * Math.sin(angle - 0.35));
}

function drawLighthouse(lh, idx, timestamp, labelPos) {
  const [x, y] = project(lh.lon, lh.lat);
  const hovered = idx === hoveredIndex;

  if (hovered && lh.period > 0) drawBeam(x, y, lh, timestamp);

  // Yellow diffuse halo
  const haloR = hovered ? 28 : 18;
  const halo = ctx.createRadialGradient(x, y, 0, x, y, haloR);
  halo.addColorStop(0,    'rgba(255,220,0,0.60)');
  halo.addColorStop(0.25, 'rgba(255,200,0,0.32)');
  halo.addColorStop(0.55, 'rgba(255,170,0,0.10)');
  halo.addColorStop(1,    'rgba(255,140,0,0)');
  ctx.beginPath();
  ctx.arc(x, y, haloR, 0, Math.PI*2);
  ctx.fillStyle = halo;
  ctx.fill();

  // Yellow core dot
  const dotR = hovered ? 5.5 : 3.5;
  ctx.beginPath();
  ctx.arc(x, y, dotR, 0, Math.PI*2);
  ctx.fillStyle = hovered ? '#ffff88' : '#ffdd00';
  ctx.shadowColor = '#ffcc00';
  ctx.shadowBlur = hovered ? 20 : 8;
  ctx.fill();
  ctx.shadowBlur = 0;

  // Hover pulse ring
  if (hovered) {
    const pulse = 0.5 + 0.5 * Math.sin(timestamp * 0.004);
    ctx.beginPath();
    ctx.arc(x, y, dotR + 4 + pulse * 4, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,220,0,${0.25 + pulse * 0.3})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Red label
  const { lx, ly, align } = labelPos;
  const fontSize = hovered ? 12 : 10;
  ctx.font = `${hovered ? 'bold ' : ''}${fontSize}px 'Share Tech Mono', monospace`;
  ctx.textAlign = align;
  ctx.fillStyle = hovered ? '#ff6666' : '#cc2200';
  ctx.shadowColor = '#ff2200';
  ctx.shadowBlur = hovered ? 10 : 5;
  ctx.fillText(SHORT_NAMES[idx], lx, ly);
  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';
}

// ── Starfield ─────────────────────────────────────────────────────
const stars = Array.from({length: 90}, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 0.6 + 0.1,
  a: Math.random() * 0.15 + 0.03
}));
function drawStars() {
  stars.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(0,200,80,${s.a})`;
    ctx.fill();
  });
}

// ── Main render loop ──────────────────────────────────────────────
function draw(ts) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  drawStars();
  drawGeoJSON();

  // Compute non-overlapping label positions for all lighthouses
  const placed = [];
  const labelPositions = lighthouses.map((lh, i) => {
    const [x, y] = project(lh.lon, lh.lat);
    return pickLabelPos(i, x, y, placed);
  });

  lighthouses.forEach((lh, i) => drawLighthouse(lh, i, ts, labelPositions[i]));
  requestAnimationFrame(draw);
}

// ── Mouse ─────────────────────────────────────────────────────────
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  if (isDragging) {
    const dx = (e.clientX - dragStartX) / viewScale;
    const dy = (e.clientY - dragStartY) / viewScale;
    viewCX = dragCX0 - dx;
    viewCY = dragCY0 + dy;
    tooltip.style.display = 'none';
    return;
  }

  let found = -1, minD = 20;
  lighthouses.forEach((lh, i) => {
    const [x, y] = project(lh.lon, lh.lat);
    const d = Math.hypot(mx - x, my - y);
    if (d < minD) { minD = d; found = i; }
  });
  hoveredIndex = found;

  if (found >= 0) {
    const lh = lighthouses[found];
    tooltip.style.display = 'block';
    tooltip.style.left = Math.min(e.clientX + 16, window.innerWidth  - 270) + 'px';
    tooltip.style.top  = Math.min(e.clientY -  10, window.innerHeight - 110) + 'px';
    tooltip.innerHTML = `
      <div class="lh-name">${lh.name}</div>
      <div class="lh-meta">${lh.desc}</div>
      <div class="lh-meta">Est. ${lh.year} &nbsp;·&nbsp; ${lh.lat.toFixed(3)}°N ${Math.abs(lh.lon).toFixed(3)}°W</div>
      <div class="lh-flash">⚡ ${lh.flash} &nbsp;·&nbsp; T = ${lh.period > 0 ? lh.period + 's' : 'inativo'}</div>`;
  } else {
    tooltip.style.display = 'none';
  }
});

canvas.addEventListener('mouseleave', () => {
  isDragging = false;
  hoveredIndex = -1;
  tooltip.style.display = 'none';
  canvas.style.cursor = 'crosshair';
});

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
